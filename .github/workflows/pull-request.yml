name: Pull Request

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-actions:
    name: Test shared actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo npm install -g bats
      - name: Test verify-release-tag
        run: bats actions/verify-release-tag/tests
